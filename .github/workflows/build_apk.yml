name: Build Android APK (ARM64)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Local AI Assistant APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install system dependencies (Ninja, CMake)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build cmake

      - name: Set up Android NDK & CMake
        run: |
          echo "Installing Android NDK r26d (26.3.11579264)..."
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          echo "ndk.dir=$ANDROID_NDK_HOME" >> android/local.properties

      - name: Fetch and verify pinned llama.cpp
        run: |
          chmod +x scripts/*.sh
          bash scripts/fetch_llama_cpp.sh

      - name: Ensure Gradle Wrapper exists
        run: |
          if [ ! -f android/gradlew ]; then
            echo "Generating Gradle wrapper via Flutter scaffolding..."
            flutter create --platforms=android /tmp/scaffold_app
            cp -n /tmp/scaffold_app/android/gradlew android/ || true
            cp -n /tmp/scaffold_app/android/gradlew.bat android/ || true
            mkdir -p android/gradle/wrapper
            cp -n /tmp/scaffold_app/android/gradle/wrapper/* android/gradle/wrapper/ || true
            chmod +x android/gradlew
          fi

      - name: Flutter dependencies & analyze
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Flutter Tests
        run: |
          flutter test

      - name: Build Release APK (ARM64)
        run: |
          flutter build apk --release --target-platform android-arm64

      - name: Verify APK contents
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "Error: APK was not generated!"
            exit 1
          fi
          echo "Listing native libraries in APK:"
          unzip -l "$APK" | grep 'lib/arm64-v8a/'
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-ai-assistant-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
