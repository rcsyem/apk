name: Build Debug APK & Verify (v0.4.10)

on:
  push:
    branches: [ main, master, 'fix/**', 'feat/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_and_verify:
    name: Build & Verify Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install system dependencies (Ninja, CMake)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build cmake

      - name: Set up Android NDK & CMake
        run: |
          echo "Installing Android NDK r26d (26.3.11579264)..."
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          mkdir -p android
          echo "ndk.dir=$ANDROID_NDK_HOME" >> android/local.properties

      - name: Fetch and verify pinned llama.cpp
        run: |
          chmod +x scripts/*.sh
          bash scripts/fetch_llama_cpp.sh

      - name: Ensure Gradle Wrapper exists & matches AGP 8.7
        run: |
          if [ ! -f android/gradlew ]; then
            echo "Generating Gradle wrapper via Flutter scaffolding..."
            flutter create --platforms=android /tmp/scaffold_app
            cp -n /tmp/scaffold_app/android/gradlew android/ || true
            cp -n /tmp/scaffold_app/android/gradlew.bat android/ || true
            mkdir -p android/gradle/wrapper
            cp -n /tmp/scaffold_app/android/gradle/wrapper/* android/gradle/wrapper/ || true
            chmod +x android/gradlew
          fi
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i -E 's/gradle-[0-9.]+-(all|bin)\.zip/gradle-8.9-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
            echo "Configured Gradle distribution in wrapper:"
            cat android/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Flutter dependencies & analyze
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter Tests
        run: |
          flutter test --reporter expanded

      - name: Run Android verification script (debug ARM64)
        run: |
          bash scripts/android_verify.sh debug

      - name: Verify produced APK file exists
        run: |
          ls -la build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: basit-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload Build Evidence Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-evidence
          path: build/evidence/
          if-no-files-found: ignore
