name: Build Android APK (ARM64)

on:
  push:
    branches: [ main, master, 'fix/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Local AI Assistant APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Set up Android NDK & CMake
        run: |
          echo "Installing Android NDK 26.3.11579264 and CMake 3.22.1..."
          sudo "/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.3.11579264" "cmake;3.22.1"
          echo "ANDROID_NDK_ROOT=/ndk/26.3.11579264" >> 
          echo "ANDROID_NDK_HOME=/ndk/26.3.11579264" >> 

      - name: Fetch llama.cpp source
        run: |
          chmod +x scripts/fetch_llama_cpp.sh
          ./scripts/fetch_llama_cpp.sh

      - name: Ensure Gradle Wrapper exists
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "Generating Gradle wrapper..."
            cd android
            gradle wrapper --gradle-version 8.9 || (curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip && unzip -q gradle.zip && gradle-8.9/bin/gradle wrapper && rm -rf gradle-8.9 gradle.zip)
            cd ..
          fi
          chmod +x android/gradlew

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify code formatting and analysis
        run: |
          echo "Running flutter analyze..."
          flutter analyze --no-fatal-warnings

      - name: Run unit & widget tests
        run: |
          echo "Running flutter tests..."
          flutter test --reporter expanded

      - name: Build Release APK (ARM64)
        run: |
          echo "Building Flutter release APK for arm64-v8a..."
          flutter build apk --release --target-platform android-arm64 --split-per-abi || {
            echo "Checking if gradle produced APK directly..."
            find . -name "*.apk"
            mkdir -p build/app/outputs/flutter-apk
            cp  build/app/outputs/flutter-apk/app-release.apk
          }

      - name: Verify APK contents
        run: |
          APK_PATH=
          if [ -z "" ]; then
            APK_PATH=
          fi
          echo "Found APK at: "
          ls -lh ""
          unzip -l "" | grep "liblai_bridge.so" || { echo "ERROR: liblai_bridge.so missing from APK!"; exit 1; }
          echo "APK verified successfully with llama.cpp native library included!"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-ai-assistant-v0.4.7-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90
